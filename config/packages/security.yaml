parameters:
    # Identifiant utilisé si GATEWAY_USER est vide ou absent.
    # Sans GATEWAY_PASSWORD_HASH, aucun mot de passe n'est accepté sur /gateway.
    gateway_default_user: gateway

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

        # Accès HTTP Basic de /gateway : mot de passe haché (voir README).
        Symfony\Component\Security\Core\User\InMemoryUser: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

        users_in_memory:
            memory:
                users:
                    '%env(default:gateway_default_user:GATEWAY_USER)%':
                        password: '%env(default::GATEWAY_PASSWORD_HASH)%'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        gateway:
            pattern: ^/gateway(?:/|$)
            provider: users_in_memory
            stateless: true
            http_basic: true

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_admin_dashboard

            # 5 tentatives par minute (par identifiant + IP)
            login_throttling:
                max_attempts: 5

            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin(?:/|$), roles: ROLE_ADMIN }
        - { path: ^/gateway(?:/|$), roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
